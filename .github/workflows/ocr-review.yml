# OpenCodeReview PR review.
#
# Required repository configuration:
#   Secret: LITELLM_OCR_API_KEY (dedicated LiteLLM virtual key)
#   LiteLLM endpoint: http://192.168.1.72:4000/v1/responses (runner LAN access required)
#   OpenCodeReview protocol: openai-responses
#   Model alias: ocr-review; reasoning effort is managed by LiteLLM
#   The action is based on v1.11.3 with the matching CLI version, plus the
#   openai-responses fix from upstream PR #1135 and strict push ranges.
#   Keep the action pinned to a commit containing both fixes.
#   Automatic reviews skip draft PRs. A collaborator can request one with
#   /open-code-review or @open-code-review in a PR comment.
#   Add last-commit to review only the current PR head against its first parent.
#
# This trusted workflow is evaluated from the base branch. The action reviews
# the PR head as git objects; it does not materialize or execute files from the
# PR branch. The same-repository guard keeps the secret away from fork PRs.

name: OpenCodeReview PR Review

on:
  pull_request_target:
    types: [opened, reopened, ready_for_review, synchronize]
  issue_comment:
    types: [created]

permissions: {}

jobs:
  code-review:
    name: OpenCodeReview
    permissions:
      contents: read
      pull-requests: write
    if: |
      (
        github.event_name == 'pull_request_target'
        && !github.event.pull_request.draft
        && github.event.pull_request.head.repo.full_name == github.repository
      )
      || (
        github.event_name == 'issue_comment'
        && github.event.issue.pull_request
        && github.event.comment.user.type != 'Bot'
        && (
          github.event.comment.author_association == 'MEMBER'
          || github.event.comment.author_association == 'OWNER'
          || github.event.comment.author_association == 'COLLABORATOR'
        )
        && (
          startsWith(github.event.comment.body, '/open-code-review')
          || startsWith(github.event.comment.body, '@open-code-review')
        )
      )
    runs-on: [self-hosted, linux, ci]
    timeout-minutes: 120

    steps:
      - name: Resolve review request
        id: pr-context
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          github-token: ${{ github.token }}
          script: |
            const { owner, repo } = context.repo;
            const isComment = context.eventName === 'issue_comment';
            let reviewRange = context.payload.action === 'synchronize' ? 'push' : 'pull_request';
            let pullRequest = context.payload.pull_request;
            if (isComment) {
              const command = context.payload.comment.body.trim().match(
                /^[@/]open-code-review(?:\s+(last-commit))?$/,
              );
              if (!command) {
                throw new Error('Unknown review command. Use @open-code-review or @open-code-review last-commit.');
              }
              reviewRange = command[1] ? 'last_commit' : 'pull_request';
              ({ data: pullRequest } = await github.rest.pulls.get({
                owner,
                repo,
                pull_number: context.issue.number,
              }));
            }
            core.setOutput('review_range', reviewRange);
            core.setOutput('full_review', String(reviewRange === 'pull_request'));
            core.setOutput('incremental', String(reviewRange !== 'pull_request'));
            core.setOutput('base_ref', pullRequest.base.ref);
            core.setOutput('head_sha', pullRequest.head.sha);
            core.setOutput(
              'same_repository',
              String(pullRequest.head.repo?.full_name === `${owner}/${repo}`),
            );

      - name: Validate OpenCodeReview configuration
        if: github.event_name == 'pull_request_target' || steps.pr-context.outputs.same_repository == 'true'
        env:
          LITELLM_OCR_API_KEY: ${{ secrets.LITELLM_OCR_API_KEY }}
        shell: bash
        run: |
          missing=()
          for name in LITELLM_OCR_API_KEY; do
            if [[ -z "${!name}" ]]; then
              missing+=("$name")
            fi
          done
          if (( ${#missing[@]} > 0 )); then
            echo "::error::Missing OpenCodeReview configuration: ${missing[*]}"
            exit 1
          fi

      - name: Run OpenCodeReview
        if: github.event_name == 'pull_request_target' || steps.pr-context.outputs.same_repository == 'true'
        uses: dubrulle-downs/open-code-review@1ad8fe7c68856aa081ab955889eeb5df5f8e80a6 # v1.11.3 + PR #1135 + bounded push/last-commit ranges
        env:
          # Keep the pinned CLI stable, including during the first version check.
          OCR_NO_UPDATE: '1'
        with:
          ocr_version: '1.11.3'
          review_concurrency: '2'
          review_range: ${{ steps.pr-context.outputs.review_range }}
          llm_url: 'http://192.168.1.72:4000/v1/responses'
          llm_auth_token: ${{ secrets.LITELLM_OCR_API_KEY }}
          llm_model: 'ocr-review'
          llm_protocol: 'openai-responses'
          llm_use_anthropic: 'false'
          llm_extra_body: '{}'
          language: 'French'
          rule: '.opencodereview/rule.json'
          base_ref: ${{ steps.pr-context.outputs.base_ref }}
          head_sha: ${{ steps.pr-context.outputs.head_sha }}
          sticky_summary: 'true'
          checkpoint_range: 'false'
          full_review: ${{ steps.pr-context.outputs.full_review }}
          incremental: ${{ steps.pr-context.outputs.incremental }}
          upload_artifacts: 'false'
